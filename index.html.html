<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>3-Minute Mission</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    background:linear-gradient(160deg,#fff7fb,#f4f0ff);
    color:#302b38; display:flex; justify-content:center; align-items:center;
  }
  .app{width:min(100%,520px); padding:28px 20px 34px; text-align:center}
  .badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #eee5f1;font-size:13px;font-weight:700}
  h1{font-size:32px;margin:16px 0 6px}
  .sub{margin:0 auto 24px;color:#756d7d}
  .card{background:#fff;border:1px solid #eee6ef;border-radius:28px;padding:28px 20px;box-shadow:0 14px 40px rgba(80,55,80,.08)}
  .streak{font-size:16px;font-weight:700;margin-bottom:16px}
  .timer{font-variant-numeric:tabular-nums;font-size:76px;line-height:1;font-weight:800;letter-spacing:-3px;margin:12px 0 20px}
  .bar{height:12px;background:#eeeaf0;border-radius:20px;overflow:hidden;margin:0 4px 22px}
  .fill{height:100%;width:0%;background:#8b5cf6;border-radius:20px;transition:width .2s linear}
  button{
    width:100%;border:0;border-radius:18px;padding:17px 20px;font-size:17px;font-weight:800;
    background:#8b5cf6;color:white;cursor:pointer;
  }
  button.secondary{background:#f2eef5;color:#4d4653;margin-top:10px}
  button:disabled{opacity:.55;cursor:default}
  .message{min-height:48px;margin:18px 4px 4px;font-size:16px;font-weight:650}
  .complete{display:none}
  .complete h2{font-size:29px;margin:4px 0 10px}
  .big{font-size:58px}
  .small{font-size:13px;color:#817886;margin-top:18px;line-height:1.45}
</style>
</head>
<body>
<main class="app">
  <div class="badge">🦷 MORNING MISSION</div>
  <h1>3 minutes. That's it.</h1>
  <p class="sub">Tap start, brush properly, and don't you dare quit early.</p>

  <section class="card" id="mission">
    <div class="streak" id="streak">🔥 Streak: 0 days</div>
    <div class="timer" id="timer">3:00</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <button id="start">START MISSION</button>
    <button class="secondary" id="reset" style="display:none">RESET</button>
    <div class="message" id="message">Your toothbrush is waiting.</div>
  </section>

  <section class="card complete" id="complete">
    <div class="big">✨</div>
    <h2>MISSION COMPLETE</h2>
    <p id="doneText"></p>
    <button id="again">DONE</button>
    <p class="small">Come back tomorrow to keep the streak alive.</p>
  </section>
</main>

<script>
const TOTAL = 180;
const timerEl = document.getElementById('timer');
const fillEl = document.getElementById('fill');
const startBtn = document.getElementById('start');
const resetBtn = document.getElementById('reset');
const messageEl = document.getElementById('message');
const streakEl = document.getElementById('streak');
const mission = document.getElementById('mission');
const complete = document.getElementById('complete');
const doneText = document.getElementById('doneText');
let endTime = null, interval = null, started = false;

function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function daysAgoKey(n){
  const d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function getStreak(){
  const last=localStorage.getItem("brushLast");
  let streak=Number(localStorage.getItem("brushStreak")||0);
  if(!last) return 0;
  if(last===todayKey()) return streak;
  if(last===daysAgoKey(1)) return streak;
  return 0;
}
function updateStreakDisplay(){
  const s=getStreak();
  streakEl.textContent="🔥 Streak: "+s+" day"+(s===1?"":"s");
}
function format(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return m+":"+String(s).padStart(2,"0");
}
function setMessage(elapsed){
  if(elapsed<45) messageEl.textContent="Get those back teeth. They count too.";
  else if(elapsed<105) messageEl.textContent="Halfway-ish. Keep going — you're doing the actual 3 minutes.";
  else if(elapsed<150) messageEl.textContent="Almost there. Don't start negotiating with the timer.";
  else messageEl.textContent="Final stretch. Finish strong.";
}
function finish(){
  if(!started) return;
  started=false;
  clearInterval(interval);
  const today=todayKey();
  const last=localStorage.getItem("brushLast");
  let streak=Number(localStorage.getItem("brushStreak")||0);
  if(last===today){
    // Already completed today; don't increment the streak again.
  } else if(last===daysAgoKey(1)){
    streak+=1;
  } else {
    streak=1;
  }
  localStorage.setItem("brushLast",today);
  localStorage.setItem("brushStreak",streak);
  updateStreakDisplay();
  mission.style.display="none";
  complete.style.display="block";
  doneText.textContent = streak===1
    ? "Day 1 complete. A beautiful beginning."
    : "You're on a "+streak+"-day streak. Tomorrow, we do it again.";
}
function tick(){
  const remaining=Math.max(0, Math.ceil((endTime-Date.now())/1000));
  const elapsed=TOTAL-remaining;
  timerEl.textContent=format(remaining);
  fillEl.style.width=(elapsed/TOTAL*100)+"%";
  setMessage(elapsed);
  if(remaining<=0) finish();
}
startBtn.onclick=()=>{
  if(started) return;
  started=true;
  startBtn.disabled=true;
  resetBtn.style.display="block";
  endTime=Date.now()+TOTAL*1000;
  tick();
  interval=setInterval(tick,200);
};
resetBtn.onclick=()=>{
  clearInterval(interval);
  interval=null;
  started=false; endTime=null;
  startBtn.disabled=false; resetBtn.style.display="none";
  timerEl.textContent="3:00"; fillEl.style.width="0%";
  messageEl.textContent="Your toothbrush is waiting.";
};
document.getElementById("again").onclick=()=>{
  clearInterval(interval);
  interval=null;
  complete.style.display="none"; mission.style.display="block";
  started=false; startBtn.disabled=false; resetBtn.style.display="none";
  timerEl.textContent="3:00"; fillEl.style.width="0%";
  messageEl.textContent="Your toothbrush is waiting.";
};
updateStreakDisplay();
</script>
</body>
</html>
